<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c14" />
    <meta name="description" content="Reloj Plot Lab - Marcación de asistencia en tablet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reloj Plot Lab" />
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=()" />
    <title>Plot Lab - Reloj Tablet</title>
    <style>
      body {
        margin: 0;
        background: #0a0c14;
        color: #f9fbff;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        min-height: 100vh;
        width: 100vw;
      }
      #loading-fallback {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #eb671b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading-fallback">
        <div class="spinner"></div>
        <p>Cargando Reloj Tablet…</p>
      </div>
    </div>
    <script type="module" src="/src/tablet-reloj/main.tsx"></script>
  </body>
</html>
