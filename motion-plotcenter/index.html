<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plot Center · Motion de servicios</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--o:#EB671B;--o2:#FF8F4A;--bg:#000005;--panel:#0E101A;--tx:#fff;--mut:#B9BECB;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:Montserrat,Inter,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0;position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden}
#ui{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 22px;background:linear-gradient(transparent,rgba(0,0,0,.88));font-size:13px;color:#9aa0b0;opacity:0;transition:opacity .35s;z-index:60}
body.ui-on #ui{opacity:1}
body.idle{cursor:none}
body.kiosk #ui{display:none}
#ui button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff;font-size:14px}
#ui button:hover{background:var(--o)}
#seek{flex:1;accent-color:var(--o)}
body.rec #ui{display:none}

/* ---------- fondo persistente ---------- */
#bg{position:absolute;inset:0}
.glow,.glow2{position:absolute;left:0;top:0;border-radius:50%;will-change:transform}
.glow{width:1500px;height:1500px;margin:-750px 0 0 -750px;background:radial-gradient(closest-side,rgba(var(--gc,235,103,27),.36),rgba(var(--gc,235,103,27),.09) 55%,transparent 100%)}
.glow2{width:1300px;height:1300px;margin:-650px 0 0 -650px;background:radial-gradient(closest-side,rgba(var(--gc2,99,102,241),.28),rgba(var(--gc2,99,102,241),.07) 55%,transparent 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:96px 96px;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 80%)}
.marks{position:absolute;inset:0;width:1920px;height:1080px}
#progress{position:absolute;left:0;bottom:0;height:8px;width:0;background:linear-gradient(90deg,#eb671b,#f59e0b,#10b981,#06b6d4,#6366f1,#8b5cf6,#f43f5e) 0 0/1920px 100% no-repeat;z-index:30}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20;opacity:0}
#hud .lg{position:absolute;left:84px;top:48px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:23px;letter-spacing:.2em}
#hud .lg .cube{width:46px;height:46px}
#hud .url{position:absolute;right:84px;top:58px;font-size:24px;font-weight:600;letter-spacing:.12em;color:var(--mut)}

/* ---------- escenas ---------- */
.scene{position:absolute;inset:0;display:none}
.kick{display:flex;align-items:center;gap:18px;font-size:28px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acl,var(--o))}
.kick i{display:block;width:64px;height:3px;background:var(--ac,var(--o));transform-origin:left}
.kick.c{justify-content:center}.kick.c i{transform-origin:center}
.ln{overflow:hidden;padding:.08em 0 .2em;margin:-.08em 0 -.2em}
.ln .in{display:block;will-change:transform}
.ch{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em 0 .2em;margin:-.06em 0 -.2em}
.ch>span{display:inline-block;will-change:transform}
svg text{font-family:Montserrat,Inter,sans-serif}
.cube{display:block;width:100%;height:100%;overflow:visible}
.cube .cb-out,.cube .cb-in{stroke-dasharray:1 1}

/* intro */
.beam{position:absolute;left:0;width:1920px;height:3px;background:linear-gradient(90deg,transparent,#8b5cf6,#eb671b,#06b6d4,transparent);opacity:0}
.cbar{display:flex;gap:12px}
.cbar span{display:block;width:64px;height:10px;border-radius:5px;opacity:0}
.ring{position:absolute;left:50%;top:41%;width:300px;height:300px;margin:-150px 0 0 -150px;border:3px solid var(--o);border-radius:50%;opacity:0}
.in-stack{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
.in-cube{width:290px;height:290px}
.in-word{font-size:132px;font-weight:800;letter-spacing:.14em;padding-left:.14em;line-height:1.1}
.in-tag{display:flex;align-items:center;gap:30px;font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);font-weight:500}
.in-tag i{display:block;width:130px;height:3px;background:linear-gradient(90deg,#eb671b,#8b5cf6,#06b6d4)}

/* manifiesto */
.mf-l{position:absolute;left:130px;top:0;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:0}
.mf-h{font-size:162px;font-weight:800;line-height:1.02;letter-spacing:-.03em}
.hl{position:relative;display:inline-block;color:var(--o)}
.hl svg{position:absolute;left:0;bottom:-4px;width:100%;height:30px;overflow:visible}
.mf-r{position:absolute;left:1250px;top:0;width:600px;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:46px}
.mf-cb{margin-top:60px}
.mf-cb span{width:92px;height:12px;border-radius:6px}
.stat{position:relative;padding-left:34px;border-left:3px solid rgba(255,255,255,.14)}
.stat .bar{position:absolute;left:-3px;top:0;width:3px;height:100%;background:var(--o);transform-origin:top}
.stat .num{font-size:112px;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat .num b{color:var(--o);font-weight:800}
.stat .lab{font-size:32px;font-weight:500;color:var(--mut);margin-top:8px;line-height:1.3}

/* servicios */
.sv-l{position:absolute;left:110px;top:0;width:830px;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:34px}
.sv-t{font-size:var(--tfs,122px);font-weight:800;line-height:1.02;letter-spacing:-.03em}
.sv-t .ln:last-child .in{color:var(--acl,var(--o))}
.sv-t .ln:last-child .in.grad{display:inline-block;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sv-d{font-size:34px;line-height:1.45;color:var(--mut);max-width:800px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:16px;max-width:830px}
.chips span{--c:var(--ac,#eb671b);display:inline-flex;align-items:center;gap:12px;font-size:28px;font-weight:600;padding:14px 28px;border-radius:999px;border:2px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 16%,transparent);color:#fff}
.chips span::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.art{position:absolute;left:990px;top:130px;width:820px;height:800px;border-radius:40px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac,#eb671b) 16%,#131622),#090a11 70%);border:1px solid color-mix(in srgb,var(--ac,#eb671b) 38%,transparent);box-shadow:0 50px 140px rgba(0,0,0,.65),0 0 180px color-mix(in srgb,var(--ac,#eb671b) 18%,transparent);overflow:hidden}
.art>svg{width:100%;height:100%;display:block}

/* proceso */
.pr-head{position:absolute;left:0;top:128px;width:1920px;text-align:center}
.pr-t{font-size:92px;font-weight:800;letter-spacing:-.03em;margin-top:20px;line-height:1.05}
.pr-t b{color:var(--o);font-weight:800}
.pr-cur{position:absolute;left:0;top:392px;width:1920px;height:90px}
.cur{position:absolute;left:0;width:1920px;display:flex;justify-content:center;align-items:baseline;gap:26px;font-size:60px;font-weight:800;letter-spacing:-.01em;opacity:0}
.cur .num{color:var(--o);font-size:60px}
.pl-base{position:absolute;left:160px;top:688px;width:1600px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.pl-prog{position:absolute;left:160px;top:687px;width:0;height:6px;border-radius:3px;background:linear-gradient(90deg,#06b6d4 0%,#f59e0b 14.28%,#8b5cf6 28.57%,#eb671b 42.85%,#6366f1 57.14%,#f43f5e 71.42%,#ec4899 85.71%,#10b981 100%) 0 0/1600px 100% no-repeat;box-shadow:0 0 24px rgba(235,103,27,.8)}
.pl-pkt{position:absolute;top:677px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(235,103,27,.5),0 0 50px 14px rgba(235,103,27,.8)}
.node{position:absolute;top:0;width:228px;margin-left:-114px;height:1080px;opacity:0}
.bub{position:absolute;left:50%;top:522px;width:104px;height:104px;margin-left:-52px;border-radius:50%;border:3px solid rgba(235,103,27,.25);background:#0b0d16;display:grid;place-items:center}
.bub svg{width:52px;height:52px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bub .num{position:absolute;right:-8px;top:-10px;font-size:19px;font-weight:800;background:var(--o);color:#fff;border-radius:999px;padding:3px 11px;letter-spacing:.04em}
.ndot{position:absolute;left:50%;top:683px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#20232f}
.lab2{position:absolute;left:0;top:728px;width:228px;text-align:center;font-size:24px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.3}

/* outro */
.ou-stack{position:absolute;left:0;top:0;width:1920px;height:940px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.ou-cube{width:170px;height:170px}
.ou-word{font-size:78px;font-weight:800;letter-spacing:.16em;padding-left:.16em;line-height:1.1}
.ou-h{font-size:76px;font-weight:800;letter-spacing:-.025em;line-height:1.05;text-align:center}
.ou-h b{color:var(--o);font-weight:800}
.cta{display:inline-flex;align-items:center;gap:22px;padding:24px 54px;border-radius:999px;background:linear-gradient(180deg,#FF7C30,#EB671B);font-size:36px;font-weight:700;margin-top:10px;box-shadow:0 0 70px rgba(235,103,27,.5)}
.cta svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ou-url{font-size:36px;font-weight:700;letter-spacing:.14em;color:var(--o2)}
.ou-ct{display:flex;gap:70px;font-size:32px;font-weight:600;color:var(--mut);margin-top:6px}
.ou-ct span b{display:block;font-size:19px;letter-spacing:.3em;color:var(--o);margin-bottom:6px;text-transform:uppercase;font-weight:700}
.mq{position:absolute;left:0;bottom:0;width:1920px;height:112px;border-top:1px solid var(--line);background:linear-gradient(rgba(235,103,27,.09),rgba(235,103,27,.09)),#050509;overflow:hidden;display:flex;align-items:center}
.mq-track{display:flex;white-space:nowrap;will-change:transform}
.mq-unit{display:flex;align-items:center;font-size:34px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.mq-unit b{display:inline-block;width:14px;height:14px;background:var(--o);transform:rotate(45deg);margin:0 44px}
#fade{position:absolute;inset:0;background:#000;opacity:1;z-index:50;pointer-events:none}
#wipe{position:absolute;inset:0;display:none;z-index:40;pointer-events:none}
#wipe>div{position:absolute;inset:0}
#wipe>.wb{background:linear-gradient(100deg,#C4520F 0%,#EB671B 35%,#FF8F4A 100%)}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="stage">
      <div id="bg">
        <div class="glow2" id="glow2"></div>
        <div class="glow" id="glow"></div>
        <div class="grid" id="grid"></div>
        <svg class="marks" viewBox="0 0 1920 1080">
          <g id="crops" stroke="#fff" stroke-opacity=".55" stroke-width="2" fill="none">
            <path d="M36 80V36H80"/><path d="M1840 36H1884V80"/><path d="M36 1000V1044H80"/><path d="M1884 1000V1044H1840"/>
          </g>
          <g id="reg" transform="translate(1862 1010)" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none">
            <circle r="13"/><circle r="4" fill="#EB671B" stroke="none"/><path d="M-22 0H22M0 -22V22"/>
          </g>
        </svg>
      </div>
      <div id="scenes"></div>
      <div id="hud">
        <div class="lg"><div id="hudCube" style="width:46px;height:46px"></div><span>PLOT CENTER</span></div>
        <div class="url">plotcenter.com.ar</div>
      </div>
      <div id="wipe"></div>
      <div id="progress"></div>
      <div id="fade"></div>
    </div>
  </div>
  <div id="ui">
    <button id="bPlay" title="Pausa / reproducir (espacio)">❚❚</button>
    <button id="bRestart" title="Reiniciar (R)">↺</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span id="tm">0:00 / 0:00</span>
    <button id="bFs" title="Pantalla completa (F)">⛶</button>
  </div>
</div>

<script>
(()=>{
/* ================= helpers ================= */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  lin:t=>t,
  o3:t=>1-Math.pow(1-t,3),
  o4:t=>1-Math.pow(1-t,4),
  io2:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  ob:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
};
const P=(t,a,d,e=E.o3)=>e(clamp((t-a)/d));
const tf=(el,x=0,y=0,s=1,r=0)=>{el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`};
const sv=(el,x=0,y=0,s=1,r=0)=>el.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s})`);
const op=(el,o)=>{el.style.opacity=o};
const dr=(el,p)=>{el.style.strokeDashoffset=1-p;el.style.strokeDasharray=p>=.9995?'none':'1 1';el.style.visibility=p<=0.0005?'hidden':'visible'};
const rv=(el,p)=>{el.style.transform=`translateY(${(1-p)*112}%)`};
const q=(r,s)=>r.querySelector(s), qa=(r,s)=>[...r.querySelectorAll(s)];
function split(el){
  const txt=el.textContent; el.textContent='';
  return [...txt].map(ch=>{
    const m=document.createElement('span');m.className='ch';
    const i=document.createElement('span');i.textContent=ch===' '?' ':ch;
    m.appendChild(i);el.appendChild(m);return i;
  });
}
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}

/* paleta de Plot Lab (src/style.css y CATEGORY_META de adminModuleCatalog) */
const C={o:'#eb671b',amber:'#f59e0b',emerald:'#10b981',cyan:'#06b6d4',indigo:'#6366f1',violet:'#8b5cf6',rose:'#f43f5e',pink:'#ec4899'};
const PAL7=[C.o,C.amber,C.emerald,C.cyan,C.indigo,C.violet,C.rose];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixHex=(a,b,t)=>{const A=hex(a),B=hex(b);return A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')};
const rgbHex=(a,b,t)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')};
const CBAR=`<div class="cbar">${PAL7.map(c=>`<span style="background:${c}"></span>`).join('')}</div>`;
const popBar=(spans,lt,a)=>spans.forEach((e,i)=>{const p=P(lt,a+i*.07,.5,E.ob);op(e,clamp(p*1.5));e.style.transform=`scaleX(${p})`});
let glowTint=null;

const CUBE=`<svg viewBox="0 0 100 100" class="cube"><path class="cb-top" d="M50 8 L88 29 L50 50 L12 29 Z" fill="#fff"/><path class="cb-out" pathLength="1" d="M50 8 L88 29 L88 71 L50 92 L12 71 L12 29 Z" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"/><path class="cb-in" pathLength="1" d="M12 29 L50 50 L88 29 M50 50 L50 92" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><g class="cb-Pg"><text transform="matrix(1 .5526 0 1 0 0)" x="31" y="55.4" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">P</text></g><g class="cb-Cg"><text transform="matrix(1 -.5526 0 1 0 0)" x="69" y="110.6" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">C</text></g></svg>`;
function cubeAnim(cube,lt,a=0){
  dr(q(cube,'.cb-out'),P(lt,a+.2,1.0,E.io3));
  dr(q(cube,'.cb-in'),P(lt,a+.85,.7,E.o3));
  op(q(cube,'.cb-top'),P(lt,a+1.25,.4));
  for(const [c,d] of [['.cb-Pg',1.45],['.cb-Cg',1.6]]){
    const g=q(cube,c),p=P(lt,a+d,.4);
    g.style.opacity=p; g.style.transform=`translateY(${(1-p)*8}px)`;
  }
}

/* ================= escenas ================= */
const DUR=[4.0,3.8,5.0,5.0,5.2,5.2,5.2,5.0,5.2,5.2,5.6,7.0,5.5];
const starts=[];let acc=0;for(const d of DUR){starts.push(acc);acc+=d}
const TOTAL=acc;
const build={};

/* ---------- 0 · intro ---------- */
build.intro=root=>{
  root.innerHTML=`<div class="beam" style="top:300px"></div><div class="beam" style="top:790px"></div>
   <div class="ring"></div><div class="ring" style="border-color:#8b5cf6"></div><div class="ring" style="border-color:#06b6d4"></div>
   <div class="in-stack"><div class="in-cube">${CUBE}</div><div class="in-word">PLOT CENTER</div>
   <div class="in-tag"><i></i><span>Gráfica integral · Vía pública · San Juan</span><i></i></div>${CBAR}</div>`;
  const cube=q(root,'.in-cube'),chars=split(q(root,'.in-word')),rings=qa(root,'.ring'),beams=qa(root,'.beam');
  const tag=q(root,'.in-tag'),lines=qa(tag,'i'),cbs=qa(root,'.cbar span');
  return lt=>{
    const pc=P(lt,.1,1.3,E.o4);
    tf(cube,0,0,lerp(.6,1,pc),lerp(-12,0,pc));op(cube,P(lt,0,.3,E.lin));
    cubeAnim(cube,lt);
    rings.forEach((r,i)=>{const p=P(lt,1.55+i*.2,1.1);tf(r,0,0,lerp(.5,4.2,p));op(r,p>0?(1-p)*.8:0)});
    beams.forEach((b,i)=>{const p=P(lt,.2+i*.15,1.6,E.io3);tf(b,lerp(-1920,1920,p));op(b,Math.sin(p*Math.PI)*.85)});
    chars.forEach((c,i)=>{c.style.transform=`translateY(${(1-P(lt,1.95+i*.05,.7,E.o4))*115}%)`});
    const pt=P(lt,2.7,.7);op(tag,pt);tag.style.transform=`translateY(${(1-pt)*20}px)`;
    lines.forEach(l=>l.style.transform=`scaleX(${P(lt,2.6,.8,E.o4)})`);
    popBar(cbs,lt,3.0);
  };
};

/* ---------- 1 · manifiesto ---------- */
build.manifest=root=>{
  root.innerHTML=`<div class="mf-l"><h1 class="mf-h">
     <div class="ln"><div class="in">Llevá tu</div></div>
     <div class="ln"><div class="in"><span class="hl">marca<svg viewBox="0 0 400 30" preserveAspectRatio="none"><path class="u" pathLength="1" d="M4 20 C 90 4, 220 28, 396 8" fill="none" stroke="#EB671B" stroke-width="7" stroke-linecap="round"/></svg></span> a la</div></div>
     <div class="ln"><div class="in">ciudad.</div></div></h1>${CBAR.replace('class="cbar"','class="cbar mf-cb"')}</div>
   <div class="mf-r">
     <div class="stat"><div class="bar" style="background:#eb671b"></div><div class="num"><span>0</span></div><div class="lab">años de experiencia</div></div>
     <div class="stat"><div class="bar" style="background:#06b6d4"></div><div class="num"><span>0</span></div><div class="lab">espacios de vía pública en San Juan</div></div>
     <div class="stat"><div class="bar" style="background:#8b5cf6"></div><div class="num"><span>0</span></div><div class="lab">pasos, de la idea a la instalación</div></div>
   </div>`;
  const ins=qa(root,'.mf-h .in'),u=q(root,'.u'),stats=qa(root,'.stat'),cbs=qa(root,'.cbar span');
  const targets=[10,120,8];
  return lt=>{
    ins.forEach((e,i)=>rv(e,P(lt,.3+i*.14,.85,E.o4)));
    u.style.strokeDasharray='1 1';dr(u,P(lt,1.1,.6,E.io3));
    popBar(cbs,lt,1.5);cbs.forEach(e=>e.style.transformOrigin='left');
    stats.forEach((s,i)=>{
      const a=.7+i*.35,p=P(lt,a,.7,E.o4),n=P(lt,a+.1,1.3,E.o3);
      op(s,p);s.style.transform=`translateX(${(1-p)*60}px)`;
      q(s,'.bar').style.transform=`scaleY(${P(lt,a,.8,E.io3)})`;

  const L=svcBuild(root,{kick:'Servicio 08 / 08',title:['Señalética','minera'],fs:112,desc:'Cartelería de seguridad con materiales homologados: asesoría, fabricación e instalación, a medida.',chips:['Seguridad','Evacuación','Direccional','Punto de encuentro'],ac:'#eab308',acl:'#fde047',chipCols:['#facc15',C.emerald,C.indigo,C.cyan],art});
  const ss=signs.map((_,i)=>q(root,'#m-s'+i)),cs=signs.map((_,i)=>q(root,'#m-c'+i)),top=q(root,'#m-top'),bot=q(root,'#m-bot');
  return lt=>{
    L(lt);
    ss.forEach((e,i)=>{
      const a=.6+i*.22,p=P(lt,a,.6,E.ob);
      sv(e,cells[i][0]+118,cells[i][1]+125+(1-p)*40,lerp(.5,1,p),(1-p)*(i%2?10:-10));op(e,P(lt,a,.2));op(cs[i],P(lt,a+.3,.4));
    });
    const t=P(lt,2.4,.6,E.o4);op(top,t);top.setAttribute('transform',`translate(0 ${(1-t)*-30})`);
    const b=P(lt,3.2,.6,E.ob);op(bot,P(lt,3.2,.2));bot.setAttribute('transform',`translate(410 753) scale(${lerp(.6,1,b)}) translate(-410 -753)`);
  };
};

/* ---------- 7 · proceso ---------- */
const STEPS=['Atención al cliente','Presupuestos','Diseño gráfico','Taller de producción','Imprenta','Taller de metalúrgica','Ploteo vehicular','Instalación'];
/* un color de Plot Lab por paso (el _L es la variante clara para texto) */
const SCOL=[C.cyan,C.amber,C.violet,C.o,C.indigo,C.rose,C.pink,C.emerald];
const SCOL_L=['#22d3ee','#fbbf24','#a78bfa','#ff8f4a','#818cf8','#fb7185','#f472b6','#34d399'];
const SRGB=SCOL.map(c=>hex(c).join(','));
const ICONS=[
 '<path d="M10 28v-6a14 14 0 0 1 28 0v6"/><rect x="7" y="26" width="7" height="12" rx="3"/><rect x="34" y="26" width="7" height="12" rx="3"/><path d="M38 38c0 4-4 6-10 6"/>',
 '<rect x="10" y="8" width="28" height="34" rx="4"/><rect x="18" y="4" width="12" height="8" rx="2"/><path d="M16 22h16M16 29h16M16 36h9"/>',
 '<path d="M24 4 34 18 24 44 14 18Z"/><circle cx="24" cy="22" r="3"/><path d="M24 25v10"/>',
 '<circle cx="24" cy="24" r="7"/><circle cx="24" cy="24" r="15" stroke-width="6" stroke-dasharray="5.9 5.9"/>',
 '<rect x="12" y="6" width="24" height="12" rx="2"/><rect x="6" y="18" width="36" height="16" rx="4"/><rect x="12" y="28" width="24" height="14" rx="2"/>',
 '<path d="M10 8h28M10 40h28M24 8v32"/><path d="M36 14l4-4M38 19l5-1"/>',
 '<path d="M5 32V26L10 19Q11 17 14 17H32Q35 17 37 20L43 26V32Z"/><circle cx="15" cy="33" r="4" fill="#0b0d16"/><circle cx="35" cy="33" r="4" fill="#0b0d16"/>',
 '<path d="M24 44s-14-12-14-24a14 14 0 0 1 28 0c0 12-14 24-14 24z"/><path d="M18 20l5 5 8-9"/>'];
build.proceso=root=>{
  const x=i=>160+i*(1600/7);
  root.innerHTML=`<div class="pr-head"><div class="kick c"><i></i><span>Cómo trabajamos</span><i></i></div><h2 class="pr-t"><div class="ln"><div class="in">De la <b>idea</b> a la instalación</div></div></h2></div>
   <div class="pr-cur">${STEPS.map((s,i)=>`<div class="cur"><span class="num" style="color:${SCOL_L[i]}">0${i+1}</span><span>${s}</span></div>`).join('')}</div>
   <div class="pl-base"></div><div class="pl-prog"></div><div class="pl-pkt"></div>
   ${STEPS.map((s,i)=>`<div class="node" style="left:${x(i)}px"><div class="bub"><svg viewBox="0 0 48 48">${ICONS[i]}</svg><span class="num" style="background:${SCOL[i]}">0${i+1}</span></div><div class="ndot"></div><div class="lab2">${s}</div></div>`).join('')}`;
  const kick=q(root,'.kick'),ki=qa(kick,'i'),ti=q(root,'.pr-t .in'),curs=qa(root,'.cur'),prog=q(root,'.pl-prog'),pkt=q(root,'.pl-pkt'),nodes=qa(root,'.node');
  const bubs=nodes.map(n=>q(n,'.bub')),dots=nodes.map(n=>q(n,'.ndot')),labs=nodes.map(n=>q(n,'.lab2')),icons=nodes.map(n=>q(n,'svg'));
  const S0=.9,DT=.64,s=i=>S0+i*DT;
  return lt=>{
    op(kick,P(lt,.2,.5));ki.forEach(i=>i.style.transform=`scaleX(${P(lt,.25,.6,E.o4)})`);
    rv(ti,P(lt,.3,.9,E.o4));
    nodes.forEach((n,i)=>{const a=P(lt,.3+i*.06,.5,E.o4);op(n,a);n.style.transform=`translateY(${(1-a)*30}px)`});
    nodes.forEach((n,i)=>{
      const on=P(lt,s(i),.35),focus=i<7?on*(1-P(lt,s(i+1),.35)):on,pop=P(lt,s(i),.5,E.ob);
      bubs[i].style.background=focus<.02?'#0b0d16':`rgba(${SRGB[i]},${.92*focus})`;
      bubs[i].style.borderColor=`rgba(${SRGB[i]},${.3+.7*on})`;
      bubs[i].style.boxShadow=`0 0 ${70*focus}px rgba(${SRGB[i]},${.75*focus})`;
      bubs[i].style.transform=`scale(${1+.22*focus*Math.min(1,pop)})`;
      icons[i].style.opacity=.4+.6*on;icons[i].style.stroke=focus>.5||on<.1?'#fff':SCOL_L[i];labs[i].style.opacity=.4+.6*on;labs[i].style.color=on>.1?SCOL_L[i]:'#fff';
      dots[i].style.background=on>.1?SCOL[i]:'#20232f';
    });
    curs.forEach((c,i)=>{const p=P(lt,s(i),.5,E.o4),o=i<7?P(lt,s(i+1),.3,E.io3):0;op(c,p*(1-o));c.style.transform=`translateY(${(1-p)*50-o*50}px)`});
    const k=clamp(Math.floor((lt-S0)/DT),0,6),seg=lt<S0?0:(lt>=s(7)?1:E.io2(clamp((lt-s(k))/DT)));
    const px=lt<S0?x(0):lt>=s(7)?x(7):lerp(x(k),x(k+1),seg);
    const g=clamp((px-160)/(1600/7),0,7),g0=Math.min(6,Math.floor(g)),cc=mixHex(SCOL[g0],SCOL[g0+1],g-g0);
    prog.style.width=(px-160)+'px';pkt.style.boxShadow=`0 0 0 6px rgba(${cc},.5),0 0 50px 14px rgba(${cc},.8)`;glowTint=cc;pkt.style.left=px+'px';op(pkt,P(lt,S0-.2,.3)*(1-P(lt,s(7)+.7,.4)));
    const fl=P(lt,s(7)+.3,.5);prog.style.boxShadow=`0 0 ${24+60*Math.sin(fl*Math.PI)}px rgba(${cc},.9)`;
  };
};

/* ---------- 8 · cierre ---------- */
const SERV=['Impresión digital','Papelería corporativa','Gráfica integral','Ploteo vehicular','Vía pública','Diseño gráfico','Stands y eventos','Señalética minera','Desarrollo web'];
const SERV_C=[C.cyan,C.amber,C.indigo,C.rose,C.o,C.violet,C.pink,'#eab308',C.emerald];
build.outro=root=>{
  const unit=`<div class="mq-unit">${SERV.map((s,i)=>`<span>${s}</span><b style="background:${SERV_C[i]}"></b>`).join('')}</div>`;
  root.innerHTML=`<div class="ou-stack"><div class="ou-cube">${CUBE}</div><div class="ou-word">PLOT CENTER</div>${CBAR}
    <div class="ou-h"><div class="ln"><div class="in">Llevá tu <b>marca</b> a la ciudad.</div></div></div>
    <div class="cta"><span>Consultá por tu proyecto</span><svg viewBox="0 0 34 34"><path d="M5 17h24M19 7l10 10-10 10"/></svg></div>
    <div class="ou-url">plotcenter.com.ar</div>
    <div class="ou-ct"><span><b style="color:#22d3ee">Teléfono</b>264 621 2163</span><span><b style="color:#a78bfa">Mail</b>contacto@plotcenter.com.ar</span><span><b style="color:#fbbf24">Dirección</b>Libertador 580 (Este), San Juan</span></div></div>
    <div class="mq"><div class="mq-track">${unit}${unit}${unit}</div></div>`;
  const cbs=qa(root,'.cbar span');
  const cube=q(root,'.ou-cube'),chars=split(q(root,'.ou-word')),hin=q(root,'.ou-h .in'),cta=q(root,'.cta'),url=q(root,'.ou-url'),cts=qa(root,'.ou-ct span'),mq=q(root,'.mq'),track=q(root,'.mq-track');
  let unitW=0;
  document.fonts&&document.fonts.ready.then(()=>{unitW=0});
  return lt=>{
    if(!unitW)unitW=track.children[0].offsetWidth||1;
    const c=P(lt,.1,1.0,E.o4);tf(cube,0,0,lerp(.7,1,c),0);op(cube,P(lt,0,.3,E.lin));cubeAnim(cube,lt,-.1);
    chars.forEach((e,i)=>e.style.transform=`translateY(${(1-P(lt,.7+i*.04,.6,E.o4))*115}%)`);
    popBar(cbs,lt,1.0);
    rv(hin,P(lt,1.2,.8,E.o4));
    const cp=P(lt,1.7,.6,E.ob);tf(cta,0,0,lerp(.7,1,cp));op(cta,clamp(cp*1.5));
    const pulse=1+.025*Math.sin(Math.max(0,lt-2.4)*5);if(lt>2.4)tf(cta,0,0,pulse);
    op(url,P(lt,2.1,.5));
    cts.forEach((e,i)=>{const p=P(lt,2.4+i*.15,.6,E.o4);op(e,p);e.style.transform=`translateY(${(1-p)*24}px)`});
    const mp=P(lt,.4,.8,E.o4);op(mq,mp);mq.style.transform=`translateY(${(1-mp)*112}px)`;
    track.style.transform=`translateX(${-((lt*150)%unitW)}px)`;
  };
};

/* ================= montaje ================= */
const stage=document.getElementById('stage'),view=document.getElementById('view');
const scenesEl=document.getElementById('scenes');
const order=['intro','manifest','print','papel','grafica','ploteo','via','diseno','stand','minera','web','proceso','outro'];
const scenes=order.map(id=>{const el=document.createElement('section');el.className='scene';el.id='sc-'+id;scenesEl.appendChild(el);return{el,update:build[id](el)}});
document.getElementById('hudCube').innerHTML=CUBE;
const glowEl=document.getElementById('glow'),gridEl=document.getElementById('grid'),hud=document.getElementById('hud'),wipeEl=document.getElementById('wipe'),glow2El=document.getElementById('glow2'),fadeEl=document.getElementById('fade'),progEl=document.getElementById('progress'),reg=document.getElementById('reg'),crops=document.getElementById('crops');
/* [x,y,escala,color 1,color 2,x2,y2]: dos brillos de fondo por escena */
const GL=[
  [960,540,1.0,C.o,C.violet,300,900],
  [560,640,1.0,C.o,C.indigo,1500,230],
  [1400,520,1.0,C.cyan,'#d946ef',300,820],
  [1400,520,1.0,C.amber,C.pink,300,800],
  [1400,540,1.0,C.indigo,C.o,300,260],
  [1400,540,1.0,C.rose,C.amber,300,300],
  [1400,430,1.1,C.o,C.indigo,280,830],
  [1400,540,1.0,C.violet,C.pink,300,280],
  [1400,520,1.0,C.pink,C.amber,300,820],
  [1400,540,1.0,'#eab308',C.emerald,300,300],
  [1380,540,1.0,C.emerald,C.cyan,300,830],
  [960,690,1.2,C.o,C.violet,1650,260],
  [960,360,1.2,C.o,C.cyan,300,820]
];
/* transición: cinta de colores que abre paso, cuerpo naranja y cinta que se retira */
const WB=document.createElement('div');WB.className='wb';wipeEl.appendChild(WB);
const RIB=[C.amber,C.rose,C.violet,C.indigo,C.cyan];
const mkRib=c=>{const d=document.createElement('div');d.style.background=c;wipeEl.appendChild(d);return d};
const ribL=RIB.map(mkRib),ribT=RIB.slice().reverse().map(mkRib);
function render(t){
  t=clamp(t,0,TOTAL-.001);
  let i=0;while(i+1<starts.length&&t>=starts[i+1])i++;
  const lt=t-starts[i];
  scenes.forEach((s,k)=>{s.el.style.display=k===i?'block':'none'});
  glowTint=null;
  scenes[i].update(lt);
  /* fondo */
  const cur=GL[i],prev=GL[Math.max(0,i-1)],m=i===0?1:E.io3(clamp(lt/1.1));
  glowEl.style.transform=`translate(${lerp(prev[0],cur[0],m)}px,${lerp(prev[1],cur[1],m)}px) scale(${lerp(prev[2],cur[2],m)*(1+.04*Math.sin(t*.9))})`;
  glowEl.style.setProperty('--gc',glowTint||mixHex(prev[3],cur[3],m));
  glow2El.style.transform=`translate(${lerp(prev[5],cur[5],m)}px,${lerp(prev[6],cur[6],m)}px) scale(${1+.05*Math.cos(t*.7)})`;
  glow2El.style.setProperty('--gc2',mixHex(prev[4],cur[4],m));
  gridEl.style.backgroundPosition=`${-t*10}px ${-t*6}px`;
  reg.setAttribute('transform',`translate(1862 1010) rotate(${t*24})`);
  crops.style.opacity=P(t,.2,.6);
  /* hud */
  hud.style.opacity=P(t,starts[1]+.5,.5)*(1-P(t,starts[starts.length-1]+.1,.4));
  /* transiciones */
  let u=-1;for(let k=1;k<starts.length;k++){const d=t-starts[k];if(d>-.5&&d<.5){u=d+.5;break}}
  if(u<=0||u>=1){wipeEl.style.display='none'}
  else{
    const e=E.io3,L=lerp(-400,2320,e(clamp(2*u))),R=lerp(-400,2320,e(clamp(2*u-1))),sk=320;
    wipeEl.style.display='block';
    WB.style.clipPath=`polygon(${R+sk}px 0,${L+sk}px 0,${L}px 1080px,${R}px 1080px)`;
    const w=46,poly=(a,b)=>`polygon(${b+sk}px 0,${a+sk}px 0,${a}px 1080px,${b}px 1080px)`;
    ribL.forEach((d,k)=>{d.style.clipPath=poly(L+w*(5-k),L+w*(4-k))});
    ribT.forEach((d,j)=>{d.style.clipPath=poly(R-w*j,R-w*(j+1))});
  }
  fadeEl.style.opacity=Math.max(1-clamp(t/.5),clamp((t-(TOTAL-.55))/.5));
  progEl.style.width=(t/TOTAL*100)+'%';
}
/* ================= reproductor ================= */
let time=0,playing=true,last=performance.now();
const bPlay=document.getElementById('bPlay'),seek=document.getElementById('seek'),tm=document.getElementById('tm');
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function set(t){time=clamp(t,0,TOTAL-.001);render(time);seek.value=time/TOTAL*1000;tm.textContent=fmt(time)+' / '+fmt(TOTAL)}
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){time+=dt;if(time>=TOTAL)time=0;set(time)}requestAnimationFrame(loop)}
function fit(){const vw=view.clientWidth,vh=view.clientHeight,s=Math.min(vw/1920,vh/1080);stage.style.transform=`translate(${(vw-1920*s)/2}px,${(vh-1080*s)/2}px) scale(${s})`}
function toggle(){playing=!playing;bPlay.textContent=playing?'❚❚':'▶'}
bPlay.onclick=toggle;document.getElementById('bRestart').onclick=()=>set(0);
seek.oninput=()=>set(seek.value/1000*TOTAL);
document.getElementById('bFs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowRight')set(time+1);else if(e.key==='ArrowLeft')set(time-1);else if(e.key==='r'||e.key==='R')set(0);else if(e.key==='f'||e.key==='F')document.getElementById('bFs').click()});
addEventListener('resize',fit);
const qs=new URLSearchParams(location.search);
if(qs.has('rec'))document.body.classList.add('rec');
/* pantalla del mostrador: ?kiosk oculta controles y cursor; la pantalla no se apaga */
const kiosk=qs.has('kiosk');
if(kiosk)document.body.classList.add('kiosk');
let idleT;
function poke(){
  document.body.classList.remove('idle');if(!kiosk)document.body.classList.add('ui-on');
  clearTimeout(idleT);idleT=setTimeout(()=>{document.body.classList.remove('ui-on');document.body.classList.add('idle')},kiosk?1500:3000);
}
addEventListener('mousemove',poke);addEventListener('touchstart',poke);poke();
stage.addEventListener('dblclick',()=>document.getElementById('bFs').click());
if(!qs.has('rec')){
  const lock=async()=>{try{await navigator.wakeLock.request('screen')}catch(e){}};
  lock();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')lock()});
}
window.__seek=t=>{playing=false;set(t)};window.__total=TOTAL;window.__starts=starts;
fit();
const startT=qs.has('t')?parseFloat(qs.get('t')):0;
if(qs.has('t')||qs.has('rec')){playing=false;bPlay.textContent='▶'}
set(startT);
(document.fonts&&document.fonts.load?document.fonts.load('800 100px Montserrat').catch(()=>{}):Promise.resolve()).then(()=>{set(time);window.__ready=true;requestAnimationFrame(t=>{last=t;loop(t)})});
})();
</script>
