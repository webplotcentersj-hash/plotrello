<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eb671b" />
    <meta name="description" content="Plot Lab: gestión de órdenes de trabajo, Kanban, asesoría y presupuestos." />
    <meta property="og:title" content="Plot Lab" />
    <meta property="og:description" content="Sistema de gestión de órdenes de trabajo con Kanban. Abrí el enlace en el navegador (requiere JavaScript)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plot Lab" />
    <title>Plot Lab</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0e0f16;
        color: #f9fbff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        min-height: 100vh;
      }
      #loading-fallback {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0b0d17 0%, #1a1d2e 100%);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top-color: #eb671b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding:24px;max-width:560px;margin:0 auto;font-family:system-ui,sans-serif;background:#0e0f16;color:#f9fbff;min-height:100vh;">
        <h1 style="color:#eb671b;">Plot Lab</h1>
        <p>Para usar la aplicación necesitás tener <strong>JavaScript</strong> activado en el navegador.</p>
        <p style="color:#b7bed3;">La ruta <code>/asesor-presupuestos</code> es el módulo de asesor técnico y presupuestos; iniciá sesión con un usuario autorizado.</p>
      </div>
    </noscript>
    <div id="app">
      <div id="loading-fallback">
        <div class="spinner"></div>
        <p id="loading-fallback-text">Cargando aplicación...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx" id="plotlab-app-entry"></script>
    <script>
      (function () {
        var BOOT = '__plotlab_booted__';
        var app = document.getElementById('app');
        var fallback = document.getElementById('loading-fallback');
        var text = document.getElementById('loading-fallback-text');

        function showBootError(message) {
          if (!app || window[BOOT]) return;
          app.innerHTML =
            '<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:24px;text-align:center;background:linear-gradient(135deg,#0b0d17 0%,#1a1d2e 100%);color:#fff;font-family:system-ui,sans-serif;">' +
            '<h1 style="color:#ff8a65;margin:0 0 12px;font-size:1.25rem;">No se pudo cargar la app</h1>' +
            '<p style="color:#b7bed3;max-width:420px;line-height:1.5;margin:0 0 20px;">' +
            (message || 'Puede ser una actualización reciente. Recargá para bajar la versión nueva.') +
            '</p>' +
            '<button type="button" onclick="window.location.reload()" style="padding:12px 22px;background:#eb671b;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:700;">Recargar</button>' +
            '</div>';
        }

        var entry = document.getElementById('plotlab-app-entry');
        if (entry) {
          entry.addEventListener('error', function () {
            showBootError('No se pudo descargar el código de la aplicación (archivos de una versión anterior).');
          });
        }

        window.setTimeout(function () {
          if (fallback && fallback.parentNode && !window[BOOT]) {
            if (text) text.textContent = 'Sigue cargando… si no avanza, recargá la página.';
            window.setTimeout(function () {
              if (!window[BOOT]) {
                showBootError('La carga tardó demasiado después de una actualización.');
              }
            }, 12000);
          }
        }, 15000);

        window.addEventListener('error', function (e) {
          if (!window[BOOT]) {
            showBootError(e.message || 'Error al iniciar la aplicación');
          }
        });
      })();
    </script>
  </body>
</html>
