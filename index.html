<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eb671b" />
    <meta name="description" content="Plot Lab: gestión de órdenes de trabajo, Kanban, asesoría y presupuestos." />
    <meta property="og:title" content="Plot Lab" />
    <meta property="og:description" content="Sistema de gestión de órdenes de trabajo con Kanban. Abrí el enlace en el navegador (requiere JavaScript)." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plot Lab" />
    <title>Plot Lab</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #0e0f16;
        color: #f9fbff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        min-height: 100vh;
      }
      #loading-fallback {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0b0d17 0%, #1a1d2e 100%);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top-color: #eb671b;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding:24px;max-width:560px;margin:0 auto;font-family:system-ui,sans-serif;background:#0e0f16;color:#f9fbff;min-height:100vh;">
        <h1 style="color:#eb671b;">Plot Lab</h1>
        <p>Para usar la aplicación necesitás tener <strong>JavaScript</strong> activado en el navegador.</p>
        <p style="color:#b7bed3;">La ruta <code>/asesor-presupuestos</code> es el módulo de asesor técnico y presupuestos; iniciá sesión con un usuario autorizado.</p>
      </div>
    </noscript>
    <div id="app">
      <div id="loading-fallback">
        <div class="spinner"></div>
        <p>Cargando aplicación...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remover el fallback cuando React se monte
      window.addEventListener('load', function() {
        setTimeout(function() {
          const fallback = document.getElementById('loading-fallback');
          if (fallback && document.getElementById('app').children.length > 1) {
            fallback.remove();
          }
        }, 100);
      });
      
      // Mostrar error si JavaScript falla
      window.addEventListener('error', function(e) {
        const app = document.getElementById('app');
        if (app) {
          app.innerHTML = '<div style="padding: 20px; text-align: center;"><h1>Error al cargar la aplicación</h1><p>' + (e.message || 'Error desconocido') + '</p><p style="color: #b7bed3;">Revisa la consola del navegador (F12) para más detalles.</p></div>';
        }
      });
    </script>
  </body>
</html>
